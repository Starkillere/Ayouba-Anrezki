<article class="post-card">
  <p class="post-card-meta">
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%d %B %Y" }}</time>
  </p>
  <h3 class="post-card-title"><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
  {% if include.post.excerpt %}<p class="post-card-excerpt">{{ include.post.excerpt }}</p>{% endif %}
  {% if include.post.tags.size > 0 %}
  <p class="post-card-tags">
    {% for tag in include.post.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
  </p>
  {% endif %}
</article>
