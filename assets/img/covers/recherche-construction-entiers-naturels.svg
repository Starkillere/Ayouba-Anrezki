  <circle cx="640" cy="250" r="18" stroke-opacity="0.90"/>
  <circle cx="640" cy="250" r="40" stroke-opacity="0.75"/>
  <circle cx="640" cy="250" r="62" stroke-opacity="0.60"/>
  <path d="M730 250 C 760 200, 790 200, 765 245" stroke-dasharray="6 6"/>
  <circle cx="860" cy="250" r="18" stroke-opacity="0.90"/>
  <circle cx="860" cy="250" r="40" stroke-opacity="0.75"/>
  <circle cx="860" cy="250" r="62" stroke-opacity="0.60"/>
  <circle cx="860" cy="250" r="84" stroke-opacity="0.45"/>
  <circle cx="1030" cy="250" r="4" fill="#f0c674"/><circle cx="1060" cy="250" r="4" fill="#f0c674"/><circle cx="1090" cy="250" r="4" fill="#f0c674"/>
