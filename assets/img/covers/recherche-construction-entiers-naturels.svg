<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Illustration : des cercles emboîtés de plus en plus nombreux, reliés par des flèches, comme une suite qui se construit à partir de rien.">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1408"/><stop offset="50%" stop-color="#33240c"/><stop offset="100%" stop-color="#1c1408"/>
    </linearGradient>
    <radialGradient id="glowbg" cx="35%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#f0c674" stop-opacity="0.22"/><stop offset="100%" stop-color="#f0c674" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#glowbg)"/>
<g fill="none" stroke="#f0c674" stroke-opacity="0.85" stroke-width="2" filter="url(#glow)">
